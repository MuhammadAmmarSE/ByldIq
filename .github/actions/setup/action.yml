name: Setup
description: Install pnpm, Node (from .nvmrc), and project dependencies

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v4
      with:
        version: 10
    - uses: actions/setup-node@v4
      with:
        node-version-file: ".nvmrc"
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
